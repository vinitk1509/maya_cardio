services:
  - type: web
    name: mayacardio-cloud
    env: python
    plan: free
    buildCommand: pip install -e .
    startCommand: python -m src.cloud.app --host 0.0.0.0 --port $PORT --db /data/cloud_data.db
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
    disk:
      name: mayacardio-data
      mountPath: /data
      sizeGB: 1
