# Fly.io Free Allowance Deployment Configuration
# 100% Free: Uses Fly.io free allowance (3 shared-cpu-1x VMs, 3GB persistent disk volume)
# Persistent disk ensures data survives container restarts, redeployments, and crashes.

app = "mayacardio-cloud"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile.arm64"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "mayacardio_data"
  destination = "/data"

[env]
  MAYACARDIO_DB = "/data/cloud_data.db"
